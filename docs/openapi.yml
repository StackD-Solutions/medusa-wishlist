openapi: 3.1.0
info:
 title: Medusa Wishlist API
 description: API for wishlist management in Medusa stores
 version: 0.1.0
servers:
 - url: http://localhost:9000
   description: Local Medusa server
paths:
 /store/wishlists:
  get:
   summary: List wishlists
   description: Returns a paginated list of wishlists for the authenticated customer
   operationId: listWishlists
   tags:
    - Wishlists
   parameters:
    - $ref: '#/components/parameters/Limit'
    - $ref: '#/components/parameters/Offset'
   responses:
    '200':
     description: Paginated list of wishlists
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/WishlistListResponse'
    '401':
     description: Unauthorized
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
  post:
   summary: Create wishlist
   description: Creates a new wishlist
   operationId: createWishlist
   tags:
    - Wishlists
   requestBody:
    required: true
    content:
     application/json:
      schema:
       $ref: '#/components/schemas/CreateWishlistRequest'
   responses:
    '201':
     description: Wishlist created
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/WishlistResponse'
    '400':
     description: Invalid request body
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '401':
     description: Unauthorized
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /store/wishlists/{id}:
  get:
   summary: Retrieve wishlist
   description: Returns a single wishlist. Public wishlists can be retrieved without authentication.
   operationId: retrieveWishlist
   tags:
    - Wishlists
   parameters:
    - $ref: '#/components/parameters/WishlistId'
   responses:
    '200':
     description: Wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/WishlistResponse'
    '404':
     description: Wishlist not found
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
  put:
   summary: Update wishlist
   description: Updates wishlist metadata
   operationId: updateWishlist
   tags:
    - Wishlists
   parameters:
    - $ref: '#/components/parameters/WishlistId'
   requestBody:
    required: true
    content:
     application/json:
      schema:
       $ref: '#/components/schemas/UpdateWishlistRequest'
   responses:
    '200':
     description: Updated wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/WishlistResponse'
    '400':
     description: Invalid request body
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '401':
     description: Unauthorized
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '404':
     description: Wishlist not found
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
  delete:
   summary: Delete wishlist
   description: Deletes a wishlist
   operationId: deleteWishlist
   tags:
    - Wishlists
   parameters:
    - $ref: '#/components/parameters/WishlistId'
   responses:
    '200':
     description: Wishlist deleted
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/DeleteResponse'
    '401':
     description: Unauthorized
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '404':
     description: Wishlist not found
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /store/wishlists/{id}/items:
  get:
   summary: List wishlist items
   description: Returns a paginated list of items in a wishlist. Public wishlists can be accessed without authentication.
   operationId: listWishlistItems
   tags:
    - Wishlist Items
   parameters:
    - $ref: '#/components/parameters/WishlistId'
    - $ref: '#/components/parameters/Limit'
    - $ref: '#/components/parameters/Offset'
   responses:
    '200':
     description: Paginated list of wishlist items
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/WishlistItemsResponse'
    '404':
     description: Wishlist not found
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
  post:
   summary: Add item to wishlist
   description: Adds a product variant to a wishlist
   operationId: addWishlistItem
   tags:
    - Wishlist Items
   parameters:
    - $ref: '#/components/parameters/WishlistId'
   requestBody:
    required: true
    content:
     application/json:
      schema:
       $ref: '#/components/schemas/AddWishlistItemRequest'
   responses:
    '201':
     description: Item added to wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/WishlistItemResponse'
    '401':
     description: Unauthorized
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '404':
     description: Product variant not found
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '409':
     description: Item already in wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /store/wishlists/{id}/items/{product_variant_id}:
  delete:
   summary: Remove item from wishlist
   description: Removes an item from a wishlist by product variant ID
   operationId: removeWishlistItem
   tags:
    - Wishlist Items
   parameters:
    - $ref: '#/components/parameters/WishlistId'
    - $ref: '#/components/parameters/ProductVariantId'
   responses:
    '200':
     description: Item removed from wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/DeleteResponse'
    '401':
     description: Unauthorized
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '404':
     description: Wishlist or product variant not found
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /admin/products/{product_id}/wishlist:
  get:
   summary: Get product wishlist count
   description: Returns the number of wishlists containing a product (admin only)
   operationId: getProductWishlistCount
   tags:
    - Admin
   parameters:
    - $ref: '#/components/parameters/ProductId'
   responses:
    '200':
     description: Wishlist count for the product
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/ProductWishlistCountResponse'
    '401':
     description: Unauthorized
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

components:
 parameters:
  WishlistId:
   name: id
   in: path
   required: true
   schema:
    type: string
  ProductId:
   name: product_id
   in: path
   required: true
   schema:
    type: string
  ProductVariantId:
   name: product_variant_id
   in: path
   required: true
   schema:
    type: string
  Limit:
   name: limit
   in: query
   schema:
    type: integer
    default: 10
  Offset:
   name: offset
   in: query
   schema:
    type: integer
    default: 0

 schemas:
  WishlistListResponse:
   type: object
   required:
    - data
    - page
   properties:
    data:
     type: array
     items:
      $ref: '#/components/schemas/Wishlist'
    page:
     $ref: '#/components/schemas/PaginationMetadata'

  WishlistResponse:
   type: object
   required:
    - data
   properties:
    data:
     $ref: '#/components/schemas/Wishlist'

  Wishlist:
   type: object
   required:
    - id
    - name
    - customer_id
    - sales_channel_id
    - visibility
    - items_count
    - created_at
    - updated_at
   properties:
    id:
     type: string
    name:
     type: string
    customer_id:
     type: string
    sales_channel_id:
     type: string
    visibility:
     $ref: '#/components/schemas/WishlistVisibility'
    items_count:
     type: integer
    created_at:
     type: string
     format: date-time
    updated_at:
     type: string
     format: date-time
    deleted_at:
     type: string
     format: date-time
     nullable: true

  WishlistItemsResponse:
   type: object
   required:
    - data
    - page
   properties:
    data:
     type: array
     items:
      $ref: '#/components/schemas/WishlistItem'
    page:
     $ref: '#/components/schemas/PaginationMetadata'

  WishlistItemResponse:
   type: object
   required:
    - data
   properties:
    data:
     $ref: '#/components/schemas/WishlistItem'

  WishlistItem:
   type: object
   required:
    - id
    - product_variant_id
    - wishlist_id
    - created_at
    - updated_at
   properties:
    id:
     type: string
    product_variant_id:
     type: string
    wishlist_id:
     type: string
    created_at:
     type: string
     format: date-time
    updated_at:
     type: string
     format: date-time
    deleted_at:
     type: string
     format: date-time
     nullable: true

  CreateWishlistRequest:
   type: object
   required:
    - sales_channel_id
   properties:
    name:
     type: string
     minLength: 1
    sales_channel_id:
     type: string

  UpdateWishlistRequest:
   type: object
   properties:
    name:
     type: string
     minLength: 1
    visibility:
     $ref: '#/components/schemas/WishlistVisibility'

  AddWishlistItemRequest:
   type: object
   required:
    - product_variant_id
   properties:
    product_variant_id:
     type: string

  ProductWishlistCountResponse:
   type: object
   required:
    - count
   properties:
    count:
     type: integer

  DeleteResponse:
   type: object
   required:
    - id
   properties:
    id:
     type: string

  Error:
   type: object
   required:
    - message
   properties:
    message:
     type: string
     description: Error message
    code:
     type: string
     description: Error code

  PaginationMetadata:
   type: object
   required:
    - offset
    - limit
    - count
   properties:
    offset:
     type: integer
     description: Where this page starts (0-based index)
    limit:
     type: integer
     description: Max number of items requested
    count:
     type: integer
     description: Total number of items available (across all pages)

  WishlistVisibility:
   type: string
   enum:
    - private
    - public
   default: private
