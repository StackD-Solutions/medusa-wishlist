openapi: 3.1.0
info:
 title: Medusa Wishlist API
 description: API for wishlist management in Medusa stores
 version: 0.1.0
servers:
 - url: http://localhost:9000
   description: Local Medusa server
paths:
 /store/wishlists:
  get:
   summary: List wishlists
   description: Returns a paginated list of wishlists for the authenticated customer
   operationId: listWishlists
   tags:
    - Wishlists
   parameters:
    - name: limit
      in: query
      schema:
       type: integer
       default: 10
    - name: offset
      in: query
      schema:
       type: integer
       default: 0
    - name: items_fields
      in: query
      schema:
       type: array
       items:
        type: string
   responses:
    '200':
     description: Paginated list of wishlists
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/PaginatedWishlistResponse'
    '401':
     description: Unauthorized
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
  post:
   summary: Create wishlist
   description: Creates a new wishlist. Authentication is optional if guest wishlists are enabled.
   operationId: createWishlist
   tags:
    - Wishlists
   requestBody:
    required: true
    content:
     application/json:
      schema:
       $ref: '#/components/schemas/CreateWishlistRequest'
   responses:
    '201':
     description: Wishlist created
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Wishlist'
    '400':
     description: Invalid request body
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '401':
     description: Unauthorized and guest wishlists are disabled
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /store/wishlists/{id}:
  get:
   summary: Retrieve wishlist
   description: Returns a single wishlist with its items. Public wishlists can be retrieved without authentication.
   operationId: retrieveWishlist
   tags:
    - Wishlists
   parameters:
    - $ref: '#/components/parameters/WishlistId'
    - name: items_fields
      in: query
      schema:
       type: array
       items:
        type: string
    - name: include_inventory_count
      in: query
      schema:
       type: boolean
    - name: include_calculated_price
      in: query
      schema:
       type: boolean
   responses:
    '200':
     description: Wishlist with items
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Wishlist'
    '403':
     description: Not authorized to access this wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
  put:
   summary: Update wishlist
   description: Updates wishlist metadata
   operationId: updateWishlist
   tags:
    - Wishlists
   parameters:
    - $ref: '#/components/parameters/WishlistId'
   requestBody:
    required: true
    content:
     application/json:
      schema:
       $ref: '#/components/schemas/UpdateWishlistRequest'
   responses:
    '200':
     description: Updated wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Wishlist'
    '400':
     description: Invalid request body
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '403':
     description: Not authorized to update this wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
  delete:
   summary: Delete wishlist
   description: Deletes a wishlist
   operationId: deleteWishlist
   tags:
    - Wishlists
   parameters:
    - $ref: '#/components/parameters/WishlistId'
   responses:
    '200':
     description: Deleted wishlist ID
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/DeleteResponse'
    '403':
     description: Not authorized to delete this wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /store/wishlists/{id}/items:
  get:
   summary: List wishlist items
   description: Returns a paginated list of items in a wishlist. Public wishlists can be accessed without authentication.
   operationId: listWishlistItems
   tags:
    - Wishlist Items
   parameters:
    - $ref: '#/components/parameters/WishlistId'
    - name: limit
      in: query
      schema:
       type: integer
       default: 10
    - name: offset
      in: query
      schema:
       type: integer
       default: 0
   responses:
    '200':
     description: Paginated list of wishlist items
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/PaginatedWishlistItemResponse'
    '403':
     description: Not authorized to access this wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
  post:
   summary: Add item to wishlist
   description: Adds a product to a wishlist
   operationId: addItemToWishlist
   tags:
    - Wishlist Items
   parameters:
    - $ref: '#/components/parameters/WishlistId'
   requestBody:
    required: true
    content:
     application/json:
      schema:
       $ref: '#/components/schemas/AddItemToWishlistRequest'
   responses:
    '201':
     description: Item added to wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/WishlistItem'
    '404':
     description: Product not found
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '409':
     description: Item already in wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /store/wishlists/{id}/items/{product_id}:
  delete:
   summary: Remove item from wishlist
   description: Removes an item from a wishlist by product ID
   operationId: removeItemFromWishlist
   tags:
    - Wishlist Items
   parameters:
    - $ref: '#/components/parameters/WishlistId'
    - name: product_id
      in: path
      required: true
      schema:
       type: string
   responses:
    '200':
     description: Removed product ID
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/DeleteResponse'
    '403':
     description: Not authorized to modify this wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '404':
     description: Product not found in wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /store/wishlists/{id}/transfer:
  post:
   summary: Transfer guest wishlist
   description: Transfers ownership of a guest wishlist to the authenticated customer
   operationId: transferWishlist
   tags:
    - Wishlists
   parameters:
    - $ref: '#/components/parameters/WishlistId'
   responses:
    '200':
     description: Wishlist transferred
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Wishlist'
    '400':
     description: Wishlist is already owned by a customer
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '404':
     description: Wishlist not found
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /store/wishlists/import:
  post:
   summary: Import public wishlist
   description: Creates a copy of a public wishlist into the authenticated customer's wishlists
   operationId: importWishlist
   tags:
    - Wishlists
   requestBody:
    required: true
    content:
     application/json:
      schema:
       $ref: '#/components/schemas/ImportWishlistRequest'
   responses:
    '201':
     description: Wishlist imported
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Wishlist'
    '403':
     description: Not authorized to import this wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '404':
     description: Wishlist not found
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /store/wishlists/total-items-count:
  get:
   summary: Get total items count
   description: Returns the total number of items across wishlists for the authenticated customer
   operationId: getTotalItemsCount
   tags:
    - Wishlists
   parameters:
    - name: wishlist_id
      in: query
      description: Optionally scope the count to a single wishlist
      schema:
       type: string
   responses:
    '200':
     description: Total items count
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/TotalItemsCountResponse'
    '401':
     description: Unauthorized
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'
    '403':
     description: Not authorized to access the specified wishlist
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

 /admin/products/{id}/wishlist:
  get:
   summary: Get product wishlist count
   description: Returns the number of wishlists containing a product (admin only)
   operationId: getProductWishlistCount
   tags:
    - Admin
   parameters:
    - name: id
      in: path
      required: true
      schema:
       type: string
   responses:
    '200':
     description: Wishlist count for the product
     content:
      application/json:
       schema:
        type: object
        required:
         - count
        properties:
         count:
          type: integer
    '401':
     description: Unauthorized
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/Error'

components:
 parameters:
  WishlistId:
   name: id
   in: path
   required: true
   schema:
    type: string

 schemas:
  Wishlist:
   type: object
   required:
    - id
    - sales_channel_id
    - visibility
    - created_at
    - updated_at
   properties:
    id:
     type: string
    name:
     type: string
     nullable: true
    customer_id:
     type: string
     nullable: true
    sales_channel_id:
     type: string
    visibility:
     type: string
     enum:
      - private
      - public
     default: private
    created_at:
     type: string
     format: date-time
    updated_at:
     type: string
     format: date-time
    deleted_at:
     type: string
     format: date-time
     nullable: true
    items:
     type: array
     items:
      $ref: '#/components/schemas/WishlistItem'
    items_count:
     type: integer

  WishlistItem:
   type: object
   required:
    - id
    - product_id
    - wishlist_id
    - created_at
    - updated_at
   properties:
    id:
     type: string
    product_id:
     type: string
    wishlist_id:
     type: string
    created_at:
     type: string
     format: date-time
    updated_at:
     type: string
     format: date-time
    deleted_at:
     type: string
     format: date-time
     nullable: true
    product:
     type: object
     nullable: true

  PaginatedWishlistResponse:
   type: object
   required:
    - data
    - count
    - skip
    - take
    - totalPages
    - currentPage
    - nextPage
    - prevPage
   properties:
    data:
     type: array
     items:
      $ref: '#/components/schemas/Wishlist'
    count:
     type: integer
    skip:
     type: integer
    take:
     type: integer
    totalPages:
     type: integer
    currentPage:
     type: integer
    nextPage:
     type: integer
    prevPage:
     type: integer

  PaginatedWishlistItemResponse:
   type: object
   required:
    - data
    - count
    - skip
    - take
    - totalPages
    - currentPage
    - nextPage
    - prevPage
   properties:
    data:
     type: array
     items:
      $ref: '#/components/schemas/WishlistItem'
    count:
     type: integer
    skip:
     type: integer
    take:
     type: integer
    totalPages:
     type: integer
    currentPage:
     type: integer
    nextPage:
     type: integer
    prevPage:
     type: integer

  CreateWishlistRequest:
   type: object
   required:
    - sales_channel_id
   properties:
    name:
     type: string
     minLength: 1
    sales_channel_id:
     type: string

  UpdateWishlistRequest:
   type: object
   properties:
    name:
     type: string
     minLength: 1
    visibility:
     type: string
     enum:
      - private
      - public

  AddItemToWishlistRequest:
   type: object
   required:
    - product_id
   properties:
    product_id:
     type: string

  ImportWishlistRequest:
   type: object
   required:
    - wishlist_id
   properties:
    wishlist_id:
     type: string

  DeleteResponse:
   type: object
   required:
    - id
   properties:
    id:
     type: string

  TotalItemsCountResponse:
   type: object
   required:
    - total_items_count
   properties:
    total_items_count:
     type: integer

  ListWishlistsQuery:
   type: object
   properties:
    items_fields:
     type: array
     items:
      type: string

  RetrieveWishlistQuery:
   type: object
   properties:
    items_fields:
     type: array
     items:
      type: string
    include_inventory_count:
     type: boolean
    include_calculated_price:
     type: boolean

  TotalItemsCountQuery:
   type: object
   properties:
    wishlist_id:
     type: string

  Error:
   type: object
   required:
    - message
   properties:
    message:
     type: string
     description: Error message
    code:
     type: string
     description: Error code
